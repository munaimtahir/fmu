# ============================================
# Local Development Docker Compose
# ============================================
# This compose file is for LOCAL DEVELOPMENT ONLY
# It publishes ports to the host for easy access
# Use: docker-compose -f docker-compose.local.yml up
# ============================================

services:
  postgres:
    image: postgres:14-alpine
    container_name: sims_postgres_local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sims_db}
      POSTGRES_USER: ${POSTGRES_USER:-sims_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sims_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Exposed for local development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sims_user} -d ${POSTGRES_DB:-sims_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sims_redis_local
    ports:
      - "6379:6379"  # Exposed for local development
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sims_backend_local
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn sims_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3 --reload"
    volumes:
      - ./backend:/app
      - static_volume:/app/static
      - media_volume:/app/media
    ports:
      - "8001:8000"  # Exposed for local development
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sims_frontend_local
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"  # Exposed for local development
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8001}
    depends_on:
      - backend

  rqworker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sims_rqworker_local
    command: python manage.py rqworker default
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import django_rq; queue = django_rq.get_queue('default'); queue.connection.ping()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: nginx for local testing of production-like setup
  # nginx:
  #   image: nginx:alpine
  #   container_name: sims_nginx_local
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
  #     - static_volume:/app/static:ro
  #     - media_volume:/app/media:ro
  #   depends_on:
  #     - backend
  #     - frontend

volumes:
  postgres_data:
  static_volume:
  media_volume:
